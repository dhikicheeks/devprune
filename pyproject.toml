[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "devprune-cli"
version = "0.1.1"
description = "Local web dashboard to find and clean caches and build artifacts (pnpm/Next.js, Laravel, Flutter) on macOS."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "dhikicheeks"}]
keywords = ["cleanup", "cache", "node_modules", "build artifacts", "developer tools", "disk space", "macos"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/dhikicheeks/devprune"
Source = "https://github.com/dhikicheeks/devprune"
Issues = "https://github.com/dhikicheeks/devprune/issues"
Changelog = "https://github.com/dhikicheeks/devprune/blob/main/CHANGELOG.md"

[project.scripts]
devprune = "devprune.cli:main"
dp = "devprune.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
devprune = ["data/*.json", "web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py39"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
